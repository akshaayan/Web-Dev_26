<h1>{{ welcomeMessage() }}</h1>

<div class="card">
  <p><strong>Visits in this session:</strong> {{ visitCount() }}</p>
  <button (click)="increaseVisits()">Increase visits</button>

</div>

    <li>Automatic UI updates when values change</li>
  </ul>
</div>
